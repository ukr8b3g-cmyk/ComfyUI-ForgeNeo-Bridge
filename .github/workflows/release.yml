name: Release verified ForgeNeo Bridge 1.0.1

on:
  workflow_run:
    workflows: [Bridge validation]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-forgeneo-bridge-1.0.1
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ukr8b3g-cmyk/ComfyUI-ForgeNeo-Bridge' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v1.0.1
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify the one-time release source
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tomllib, urllib.error, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          def read(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise
          if read('/releases/tags/v1.0.1') is not None:
              print('v1.0.1 is already published; no changes made.')
              raise SystemExit(0)
          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          if config['project']['version'] != '1.0.1':
              print('This workflow publishes only v1.0.1.')
              raise SystemExit(0)
          expected = {'web/bridge.js': '3b747f313979fba994158f5e28e1dc8a25d87408151a79dca5dca4d9abbda272', 'tests/frontend.test.mjs': '19cc15e543ec711a29eeb47f08956266b8c0150646c9028151e59df4092e9014', 'tests/drop_priority.test.mjs': 'eb958fa6c28776129cc71c9fa299dce22074677ab12cf1347ec3053fb1ec3cbe', 'pyproject.toml': '3b1d52c7e0d65ee42cb7e417566dfd8de766b256a27f94382fe34288ee90aeae', '__init__.py': '812f9d119212209790359137bd43832b4d1db43be97bee8c741ee084ae7f95c2', 'README.md': 'c98e24f128ca16ece945e35d4f775c9bf35ddbb39bb9098a3fc095c01620d7f9', 'CHANGELOG.md': '9428d152241e9f7f0d2f549e34a14d1f7f27874b0c6b12404ebd3771cde6450a', '.github/workflows/tests.yml': 'b9d157211a39cec13310bc11da3009ce68ef0b7feb062574956c208deb94939c'}
          for path, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest, path
          head = read('/git/ref/heads/main')
          assert head['object']['sha'] == os.environ['RELEASE_SHA'], 'main advanced after validation'
          tag = read('/git/ref/tags/v1.0.1')
          assert tag is None or tag['object']['sha'] == os.environ['RELEASE_SHA'], 'Existing tag differs'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text('JPEG画像のドロップ時、Custom ScriptsのA1111読み込みがForge Neo Bridgeより先に処理する競合を修正しました。ComfyUIの標準ワークフロー読み込みと、Bridgeを無効にした場合の動作を維持します。\n\n### 確認結果\n- ComfyUI_testで実際のドラッグ＆ドロップを確認：Forge JPEGはBridgeの10ノードを復元。\n- Krea2 WebPは17ノードの位置・サイズ、19本の配線、グループ、BBOX・プロンプトを含む全ウィジェット値が元データと一致。\n- JavaScriptテスト56件成功。新たなGPU生成・画質再現性の検証は行っていません。\n\n更新後はブラウザーを再読み込みしてください。\n\n### English\nFix JPEG import precedence when another extension installs its importer after Bridge setup. Preserve native Comfy workflow imports and the disabled setting. Verified actual pointer drops for a Forge JPEG and a Krea2 WebP, with exact Krea2 layout and saved-widget restoration; 56 JavaScript tests pass. No additional GPU-generation or image-parity claim. Refresh the browser after updating.\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('publish=true\n')
          PY
      - name: Publish v1.0.1 from the tested commit
        if: steps.source.outputs.publish == 'true'
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "v1.0.1 — JPEG drop compatibility" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
